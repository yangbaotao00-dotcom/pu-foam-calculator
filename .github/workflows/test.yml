name: PU Foam Calculator Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/calculator-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check syntax and run tests
        run: npm run check
